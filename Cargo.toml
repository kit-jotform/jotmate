[package]
name = "jotmate"
version = "1.4.1"
edition = "2021"
description = "Jotform developer productivity CLI"

[lib]
name = "jotmate"
path = "src/lib.rs"

[[bin]]
name = "jotmate"
path = "src/main.rs"

[dependencies]
clap        = { version = "4.5",  features = ["derive", "env"] }
tokio       = { version = "1.43", features = ["full"] }
reqwest     = { version = "0.12", features = ["json", "cookies", "rustls-tls"], default-features = false }
serde       = { version = "1.0",  features = ["derive"] }
serde_json  = "1.0"
toml        = "0.8"
dirs        = "5.0"
chrono      = { version = "0.4",  features = ["serde"] }
chrono-tz   = "0.10"
anyhow      = "1.0"
thiserror   = "2.0"
rpassword   = "7.3"
futures     = "0.3"
ratatui     = "0.29"
crossterm   = { version = "0.28", features = ["event-stream"] }
ignore      = "0.4"
async-trait = "0.1"
flate2      = "1.0"
tar         = "0.4"
semver      = "1.0"

[dev-dependencies]
tempfile    = "3.14"
mockito     = "1.6"
serial_test = "3.2"

[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
